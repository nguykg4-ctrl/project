version: '3.8'

services:
  screenworking-api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:80"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=screenworking_db;Username=postgres;Password=ScreenWorkingSecurePass2026!
      - Jwt__Secret=ScreenWorkingSuperSecretKey2026!WithMinimum256BitsLength
    depends_on:
      - postgres

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: screenworking_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ScreenWorkingSecurePass2026!
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
